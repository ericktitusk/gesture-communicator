name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger a build manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 3.10 or 3.11 is safest for MediaPipe / OpenCV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --collect-all mediapipe `
            --collect-all cv2  --add-data "model.joblib" `
            main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: gesture-communicator-windows
          path: dist/*.exe

